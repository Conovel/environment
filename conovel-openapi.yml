openapi: 3.0.0
info:
  title: Conovel API
  version: 1.0.0
servers:
  - url: /v1
paths:
  /sentences:
    post:
      tags:
        - sentences
      operationId: postSentence
      summary: "メイン投稿の続きの新規投稿を作成（認証あり）"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostSentence"
      responses:
        '201':
          description: "新規投稿の追加に成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentenceIdOnly"
        '422':
          description: "新規投稿の追加に失敗"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '409':
          description: "親投稿が編集されたため、投稿を保留"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictSentence"
  /sentences/{sentenceId}:
    get:
      tags:
        - sentences
      operationId: getSentenceById
      summary: "IDで投稿を取得（認証あり）"
      parameters:
        - name: sentenceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "投稿IDで取得した投稿および関連投稿"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewSentence"
        '404':
          description: "投稿が見つからない"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /evaluations:
    post:
      tags:
        - evaluations
      operationId: evaluateSentence
      summary: "投稿に対する評価を追加（認証あり）"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateSentence"
      responses:
        '201':
          description: "評価の追加に成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewEvaluation"
        '422':
          description: "評価の追加に失敗"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"          
  /novels:
    get:
      tags:
        - novels
      operationId: getNovels
      summary: "小説リストを取得"
      responses:
        '200':
          description: "直近で後続の投稿があったものを先頭にした小説リスト"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NovelList"
        '422':
          description: "小説リストの取得に失敗"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"                   
  /novels/{titleId}:
    get:
      tags:
        - novels
      operationId: getNovelById
      summary: "IDで小説の概要を取得"
      parameters:
        - name: titleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "小説IDで取得した各小説の概要"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NovelDetail"
        '404':
          description: "小説が見つからない"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"            
  /users/me:
    get:
      tags:
        - users
      operationId: getUserByMe
      summary: "自分自身のユーザーアカウント情報を取得（認証あり）"
      responses:
        '200':
          description: "自分自身のユーザーアカウント情報"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewMeUser"
        '404':
          description: "ユーザーが見つからない"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"  
  /users/me/update:
    post:
      tags:
        - users
      operationId:  updateUserByMe
      summary: "自分自身のユーザーアカウント情報を更新（認証あり）"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUser"
      responses:
        '200':
          description: "ユーザー情報の更新に成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewMeUser"
        '422':
          description: "ユーザー情報の更新に失敗"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"  
  /users/me/delete:
    post:
      tags:
        - users
      operationId:  deleteUserByMe
      summary: "自分自身のユーザーアカウントを論理削除（認証あり）"
      responses:
        '200':
          description: "ユーザーの削除に成功"
        '422':
          description: "ユーザーの削除に失敗"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"  
  /users/me/viewedNovels:
    get:
      tags:
        - users
      operationId: getViewedNovelsByMe
      summary: "自分自身が閲覧している小説リストを取得（認証あり）"
      responses:
        '200':
          description: "自分自身が閲覧している小説リスト"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NovelList"
        '404':
          description: "ユーザーが見つからない"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/me/viewedLastSentence/{titleId}:
    get:
      tags:
        - users
      operationId: getViewedLastSentenceByMe
      summary: "小説の中で自分自身が最後に閲覧した投稿のIDを取得（認証あり）"
      parameters:
        - name: titleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "説の中で自分自身が最後に閲覧した投稿のID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentenceIdOnly"
        '404':
          description: "小説の中で自分自身が閲覧した最後の投稿が見つからない"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{userId}:
    get:
      tags:
        - users
      operationId: getUserById
      summary: "IDで自分以外のユーザーアカウント情報を取得"
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "ユーザーIDで取得したユーザーアカウント情報"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '404':
          description: "ユーザーが見つからない"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"  
  /users/{userId}/postedNovels:
    get:
      tags:
        - users
      operationId: getNovelsByUserId
      summary: "ユーザーが投稿している小説リストを取得"
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "ユーザーIDで取得したユーザーが投稿している小説リスト"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NovelList"
        '404':
          description: "ユーザーが見つからない"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"  
  /auth/logout:
    post:
      tags:
        - auth
      operationId: logOut
      summary: "ログアウト"
      responses:
        '200':
          description: "ログアウト成功"
        '401':
          description: "認証失敗"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"  
  /auth/refresh:
    post:
      tags:
        - auth
      operationId: refreshToken
      summary: "トークンのリフレッシュ（認証あり）"
      responses:
        '200':
          description: "トークンのリフレッシュ成功"
        '401':
          description: "認証失敗"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    Sentence:
      type: object
      properties:
        sentenceId:
          type: integer
          format: int64
          description: "投稿の一意のid（この値は他の投稿と重複しない必要があります）"
        sentence:
          type: string
          description: "投稿の本文テキスト"
        sentenceUserId:
          type: integer
          format: int64
          description: "投稿ユーザーのid"
        sentencePenName:
          type: string
          description: "投稿ユーザーのペンネーム"
        profileIconImage:
          type: string
          description: "投稿ユーザーアイコン画像のurl"
        evaluationGoodCount:
          type: integer
          description: "投稿に対するGood評価の数"
        evaluationStayCount:
          type: integer
          description: "投稿に対するStay評価の数"
        userEvaluation:
          type: string
          enum: [good, bad, stay, null]
          description: "投稿に対するログインユーザーの評価状態"
        createdAt:
          type: string
          format: date-time
          description: "投稿日時"
        updatedAt:
          type: string
          format: date-time
          description: "修正日時"
    Sentences:
      type: array
      items:
        $ref: "#/components/schemas/Sentence"
    ViewSentence:
      type: object
      properties:
        main:
          $ref: "#/components/schemas/Sentence"
        parent:
          $ref: "#/components/schemas/Sentence"
        parallels:
          $ref: "#/components/schemas/Sentences"
        children:
          $ref: "#/components/schemas/Sentences"
    SentenceIdOnly:
      type: object
      properties:
        sentenceId:
          type: integer
          format: int64
          description: "投稿の一意のid"
    PostSentence:
      type: object
      required:
        - parentSentenceId
        - parentUpdatedAt
        - sentence
      properties:
        parentSentenceId:
          type: integer
          format: int64
          description: "親投稿のid（必須）"
        parentUpdatedAt:
          type: string
          format: date-time
          description: "親投稿の修正日時(投稿中の親投稿の更新有無を確認するため)（必須）"
        sentence:
          type: string
          description: "新投稿の本文テキスト（必須）"
    EvaluateSentence:
      type: object
      required:
        - sentenceId
        - evaluation
      properties:
        sentenceId:
          type: integer
          format: int64
          description: "評価対象の投稿のID（必須）"
        evaluation:
          type: string
          enum: [good, bad, stay]
          description: "評価の種類（必須）"
    ConflictSentence:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - $ref: "#/components/schemas/SentenceIdOnly"    
    ViewEvaluation:
      type: object
      properties:
        sentenceId:
          type: integer
          format: int64
          description: "評価対象の投稿のID"
        evaluationGoodCount:
          type: integer
          format: int64
          description: "Good評価の数"
        evaluationStayCount:
          type: integer
          format: int64
          description: "Stay評価の数"
        userEvaluation:
          type: string
          enum: [good, bad, stay, null]
          description: "投稿に対するログインユーザーの評価状態"
    NovelListItem:
      type: object
      properties:
        titleId:
          type: integer
          format: int64
          description: "小説の一意のid（この値は他の小説と重複しない必要があります）"
        title:
          type: string
          description: "小説のタイトル"
        famousSentenceText:
          type: string
          description: "名言・印象に残るシーン"
        authorUserId:
          type: integer
          format: int64
          description: "小説の作者のid"
        authorPenName:
          type: string
          description: "小説の作者のペンネーム"
        profileIconImage:
          type: string
          description: "小説の作者のアイコン画像のurl"
        titleGenres:
          type: array
          items:
            type: string
          description: "小説のジャンル"
        isNew:
          type: boolean
          description: "新着小説かどうか"
        isFamous:
          type: boolean
          description: "人気小説かどうか"
        viewCount:
          type: integer
          description: "小説の閲覧数"
        evaluationGoodCount:
          type: integer
          description: "小説のGood評価の数"
        createdAt:
          type: string
          format: date-time
          description: "小説の作成日時"
        updatedAt:
          type: string
          format: date-time
          description: "小説の修正日時"
    NovelList:
      type: array
      items:
        $ref: "#/components/schemas/NovelListItem"
    NovelDetail:
      allOf:
        - $ref: "#/components/schemas/NovelListItem"
        - type: object
          properties:
            mainCopy:
              type: string
              description: "小説の紹介文"
            sentenceUserCount:
              type: integer
              description: "小説に投稿している投稿者の数"
            sentenceHierarchyCount:
              type: integer
              description: "小説に投稿された投稿の階層数"
            readerCount:
              type: integer
              description: "小説を読んだユーザーの数"
            overview:
              type: string
              description: "小説のあらすじ"
            firstSentenceId:
              type: integer
              format: int64
              description: "小説の最初の投稿のid"
    User:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          description: "ユーザーの一意のid"
        penName:
          type: string
          description: "ユーザーのペンネーム"
        nickName:
          type: string
          description: "ユーザーのニックネーム"
        profileIconImage:
          type: string
          description: "ユーザーアイコン画像のurl"
        evaluationGoodCount:
          type: integer
          description: "Good評価の数"
        createdAt:
          type: string
          format: date-time
          description: "ユーザーの作成日時"
        updatedAt:
          type: string
          format: date-time
          description: "ユーザーの修正日時"
    ViewMeUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            birthYm:
              type: string
              description: "ユーザーの生年月（YYYY/MM）"
            isAnonymous:
              type: boolean
              description: "匿名設定"
            agreedTermsVersion:
              type: integer
              description: "同意した利用規約のバージョン"
    UpdateUser:
      type: object
      required:
        - penName
        - nickName
        - isAnonymous
        - birthYm
        - agreedTermsVersion
      properties:
        penName:
          type: string
          description: "ユーザーのペンネーム（必須）"
        nickName:
          type: string
          description: "ユーザーのニックネーム（必須）"
        isAnonymous:
          type: boolean
          description: "匿名設定（必須）"
        profileIconImage:
          type: string
          description: "ユーザーアイコン画像のurl"
        birthYm:
          type: string
          description: "ユーザーの生年月（YYYY/MM）（必須）"
        agreedTermsVersion:
          type: integer
          description: "同意した利用規約のバージョン（必須）"
        remarks:
          type: string
          description: "ユーザーの備考"
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
              format: int64
              description: "エラーコード"
            message:
              type: string
              description: "エラーメッセージ"