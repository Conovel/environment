openapi: 3.0.0
info:
  title: Conovel API
  version: 1.0.0
servers:
  - url: /v1
paths:
  /sentences:
    post:
      tags:
        - sentences
      operationId: postSentence
      summary: "メイン投稿の続きの新規投稿を作成"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostSentence"
      responses:
        '201':
          description: "新規投稿の追加に成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewSentence"
        '400':
          description: "新規投稿の追加に失敗"
  /sentences/{sentence_id}:
    get:
      tags:
        - sentences
      operationId: getSentenceById
      summary: "IDで投稿を取得"
      parameters:
        - name: sentence_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "投稿IDで取得した投稿および関連投稿"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewSentence"
        '404':
          description: "投稿が見つからない"
  /evaluations:
    post:
      tags:
        - evaluations
      operationId: evaluateSentence
      summary: "投稿に対する評価を追加"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateSentence"
      responses:
        '201':
          description: "評価の追加に成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewEvaluation"
        '400':
          description: "評価の追加に失敗"
  /novels:
    get:
      tags:
        - novels
      operationId: getNovels
      summary: "小説一覧を取得"
      responses:
        '200':
          description: "直近で後続の投稿があったものを先頭にした小説一覧"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Novels"
  /novels/{title_id}:
    get:
      tags:
        - novels
      operationId: getNovelById
      summary: "IDで小説の概要を取得"
      parameters:
        - name: title_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "小説IDで取得した小説の概要"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NovelOverview"
        '404':
          description: "小説が見つからない"
  /users: # 不要なAPI？（調査中）
    post:
      tags:
        - users
      operationId: registerUser
      summary: "ユーザー登録"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUser"
      responses:
        '201':
          description: "ユーザー登録に成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterUserResult"
        '400':
          description: "ユーザー登録に失敗"
  /users/me: # 他のユーザーに表示させたくない情報を含むためmeに変更
    get:
      tags:
        - users
      operationId: getUserByMe
      summary: "自分自身のユーザーアカウント情報を取得"
      responses:
        '200':
          description: "自分自身のユーザーアカウント情報"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewMeUser"
        '404':
          description: "ユーザーが見つからない"
  /users/me/update: # 他のユーザーにアカウント更新させたくないためmeに変更
    post:
      tags:
        - users
      operationId:  updateUserByMe
      summary: "自分自身のユーザーアカウント情報を更新"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUser"
      responses:
        '200':
          description: "ユーザー情報の更新に成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          description: "ユーザー情報の更新に失敗"
  /users/me/delete: # 他のユーザーにアカウント削除させたくないためmeに変更
    post:
      tags:
        - users
      operationId:  deleteUserByMe
      summary: "自分自身のユーザーアカウントを削除（論理削除）"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteUser"
      responses:
        '200':
          description: "ユーザーの削除に成功"
        '400':
          description: "ユーザーの削除に失敗"
  /users/me/viewed_novels: # 他のユーザーに表示させたくない情報を含むためmeに変更
    get:
      tags:
        - users
      operationId: getViewedNovelsByMe
      summary: "自分自身が閲覧している小説一覧を取得"
      responses:
        '200':
          description: "自分自身が閲覧している小説一覧"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Novels"
        '404':
          description: "ユーザーが見つからない"
  /users/{user_id}:
    get:
      tags:
        - users
      operationId: getUserById
      summary: "IDで自分以外のユーザーアカウント情報を取得"
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "ユーザーIDで取得したユーザーアカウント情報"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '404':
          description: "ユーザーが見つからない"
  /users/{user_id}/posted_novels:
    get:
      tags:
        - users
      operationId: getNovelsByUserId
      summary: "ユーザーが投稿している小説一覧を取得"
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "ユーザーIDで取得したユーザーが投稿している小説一覧"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Novels"
        '404':
          description: "ユーザーが見つからない"
  /auth/login: # 不要なAPI？（調査中）
    post:
      tags:
        - auth
      operationId: logIn
      summary: "ログイン"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: "ログイン成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        '401':
          description: "認証失敗"
  /auth/logout: # 不要なAPI？（調査中）
    post:
      tags:
        - auth
      operationId: logOut
      summary: "ログアウト"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        '200':
          description: "ログアウト成功"
        '401':
          description: "認証失敗"
components:
  schemas:
    Sentence:
      type: object
      properties:
        sentence_id:
          type: integer
          format: int64
          description: "投稿の一意のid（この値は他の投稿と重複しない必要があります）"
        sentence:
          type: string
          description: "投稿の本文テキスト"
        sentence_user_id:
          type: integer
          format: int64
          description: "投稿ユーザーのid"
        sentence_user_name:
          type: string
          description: "投稿ユーザーのペンネーム"
        profile_icon_image:
          type: string
          description: "投稿ユーザーアイコン画像のurl"
        evaluation_good_count:
          type: integer
          description: "投稿に対するGood評価の数"
        evaluation_stay_count:
          type: integer
          description: "投稿に対するStay評価の数"
        created_at:
          type: string
          format: date-time
          description: "投稿日時"
        updated_at:
          type: string
          format: date-time
          description: "修正日時"
    Sentences:
      type: array
      items:
        $ref: "#/components/schemas/Sentence"
    ViewSentence:
      type: object
      properties:
        main:
          $ref: "#/components/schemas/Sentence"
        parent:
          $ref: "#/components/schemas/Sentence"
        parentParallel:
          $ref: "#/components/schemas/Sentences"
        children:
          $ref: "#/components/schemas/Sentences"
    PostSentence:
      type: object
      properties:
        parent_sentence_id:
          type: integer
          format: int64
          description: "親投稿のid"
        sentence:
          type: string
          description: "新投稿の本文テキスト"
    EvaluateSentence:
      type: object
      properties:
        sentence_id:
          type: integer
          format: int64
          description: "評価対象の投稿のID"
        evaluation:
          type: string
          enum: [good, bad, stay]
          description: "評価の種類"
    ViewEvaluation:
      type: object
      properties:
        sentence_id:
          type: integer
          format: int64
          description: "評価対象の投稿のID"
        evaluation_good_count:
          type: integer
          format: int64
          description: "Good評価の数"
        evaluation_stay_count:
          type: integer
          format: int64
          description: "Stay評価の数"
    Novel:
      type: object
      properties:
        title_id:
          type: integer
          format: int64
          description: "小説の一意のid（この値は他の小説と重複しない必要があります）"
        title:
          type: string
          description: "小説のタイトル"
        famous_sentence_text:
          type: string
          description: "名言・印象に残るシーン"
        author_user_id:
          type: integer
          format: int64
          description: "小説の作者のid"
        author_user_name:
          type: string
          description: "小説の作者のペンネーム"
        profile_icon_image:
          type: string
          description: "小説の作者のアイコン画像のurl"
        title_genres:
          type: array
          items:
            type: string
          description: "小説のジャンル"
        is_new: # ブラウザ側で判定するなら不要？
          type: boolean
          description: "新着小説かどうか"
        is_famous: # ブラウザ側で判定するなら不要？
          type: boolean
          description: "人気小説かどうか"
        view_count:
          type: integer
          description: "小説の閲覧数"
        evaluation_good_count: # 追加（メダル数を表示しない代わりに）
          type: integer
          description: "小説のGood評価の数"
        created_at:
          type: string
          format: date-time
          description: "小説の作成日時"
        updated_at:
          type: string
          format: date-time
          description: "小説の修正日時"
    Novels:
      type: array
      items:
        $ref: "#/components/schemas/Novel"
    NovelOverview:
      allOf:
        - $ref: "#/components/schemas/Novel"
        - type: object
          properties:
            main_copy:
              type: string
              description: "小説の紹介文"
            sentence_user_count:
              type: integer
              description: "小説に投稿された投稿の数"
            sentence_hierarchy_count:
              type: integer
              description: "小説に投稿された投稿の階層数"
            reader_count:
              type: integer
              description: "小説を読んだユーザーの数"
            overview:
              type: string
              description: "小説の概要"
    RegisterUser:
      type: object
      properties:
        email:
          type: string
          format: email
          description: "ユーザーのメールアドレス"
        google_sub:
          type: string
          maxLength: 128
          description: "Googleのサブジェクト識別子"
    RegisterUserResult:
      allOf:
        - $ref: "#/components/schemas/RegisterUser"
        - type: object
          properties:
            user_id:
              type: integer
              format: int64
              description: "ユーザーの一意のid"
            created_at:
              type: string
              format: date-time
              description: "ユーザーの作成日時"
    LoginRequest:
      type: object
      properties:
        google_token:
          type: string
          description: "Google OAuthのトークン"
      required:
        - google_token
    LoginResponse:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
          description: "ユーザーの一意のID"
        access_token:
          type: string
          description: "アクセストークン"
    LogoutRequest:
      type: object
      properties:
        access_token:
          type: string
          description: "アクセストークン"
      required:
        - access_token
    User:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
          description: "ユーザーの一意のid"
        user_name:
          type: string
          description: "ユーザーのペンネーム"
        nick_name:
          type: string
          description: "ユーザーのニックネーム"
        profile_icon_image:
          type: string
          description: "ユーザーアイコン画像のurl"
        evaluation_good_count:
          type: integer
          description: "Good評価の数"
        created_at:
          type: string
          format: date-time
          description: "ユーザーの作成日時"
        updated_at:
          type: string
          format: date-time
          description: "ユーザーの修正日時"
    ViewMeUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            birth_year_and_month:
              type: string
              description: "ユーザーの生年月（YYYY/MM）"
            is_anonymous:
              type: boolean
              description: "匿名設定"
    UpdateUser:
      type: object
      properties:
        user_name:
          type: string
          description: "ユーザーのペンネーム"
        nick_name:
          type: string
          description: "ユーザーのニックネーム"
        is_anonymous:
          type: boolean
          description: "匿名設定"
        profile_icon_image: #追加
          type: string
          description: "ユーザーアイコン画像のurl"
    DeleteUser:
      type: object
      properties:
        access_token:
          type: string
          description: "アクセストークン"
      required:
        - user_id
        - access_token