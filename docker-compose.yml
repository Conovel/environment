services:
  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: builder/frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    env_file:
      - ./frontend/.env
    networks:
      - conovel-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # command: sh -c "vite --host --port ${PORT:-3000}"

  backend:
    container_name: backend
    build:
      context: .
      dockerfile: builder/backend/Dockerfile
    ports:
      - "3001:3001"
    networks:
      - conovel-network
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - swagger_data:/app/swagger
    command: sh -c "bundle exec rails db:create db:migrate db:seed && bundle exec puma -C config/puma.rb"

  db:
    container_name: db
    build:
      context: .
      dockerfile: builder/db/Dockerfile
    ports:
      - "3306:3306"
    networks:
      - conovel-network
    env_file:
      - .env
      - ./backend/.env
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  conovel-network:
    driver: bridge

volumes:
  db_data:
  swagger_data:
